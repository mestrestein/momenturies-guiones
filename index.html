<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guiones Momenturies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ec; --card:#fffdf9; --ink:#1f1b16; --muted:#6f665b; --line:#e4dccf;
  --accent:#9a6b2f; --accent-soft:#f1e6d4; --voz:#1f1b16; --plano:#55606b;
  --ok:#2f7a4a; --warn:#a4661a; --bad:#9b3b34;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151310; --card:#1e1b17; --ink:#f1ebe2; --muted:#a59b8e; --line:#332e27;
    --accent:#d6a35c; --accent-soft:#2e261b; --voz:#f1ebe2; --plano:#a9b4bf;
    --ok:#6cc08a; --warn:#e0a34e; --bad:#e07a70;
  }
}
:root[data-theme="dark"]{
  --bg:#151310; --card:#1e1b17; --ink:#f1ebe2; --muted:#a59b8e; --line:#332e27;
  --accent:#d6a35c; --accent-soft:#2e261b; --voz:#f1ebe2; --plano:#a9b4bf;
  --ok:#6cc08a; --warn:#e0a34e; --bad:#e07a70;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
header h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
details.reglas{margin:22px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.reglas summary{cursor:pointer;font-weight:600}
details.reglas ul{margin:10px 0 2px;padding-left:20px}
details.reglas li{margin:4px 0}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.id{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.card h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.meta span{background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.estado{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid currentColor;white-space:nowrap}
.e-Ganador,.e-Montado{color:var(--ok)} .e-Descartado{color:var(--bad)} .e-en-test,.e-En-test{color:var(--warn)}
table{width:100%;border-collapse:collapse;margin:14px 0 6px}
td{vertical-align:top;padding:9px 8px;border-top:1px solid var(--line)}
td.t{width:64px;color:var(--muted);font-size:12.5px;white-space:nowrap;padding-left:0}
td.voz{color:var(--voz);font-weight:500}
td.plano{color:var(--plano);font-size:13.5px;width:40%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 8px 6px;font-weight:600}
th:first-child{padding-left:0}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-size:13.5px}
.extra h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:600}
.extra ul{margin:0;padding-left:18px}
.notas{margin-top:10px;font-size:13.5px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.acciones{display:flex;gap:8px;margin-top:12px}
button.copy{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer}
button.copy:hover{background:var(--accent-soft)}
.pie{margin-top:28px;font-size:12.5px;color:var(--muted)}
@media (max-width:680px){
  table,tbody,tr,td{display:block;width:auto!important}
  thead{display:none}
  tr{border-top:1px solid var(--line);padding:8px 0}
  td{border:0;padding:2px 0}
  td.plano::before{content:"Plano: ";font-weight:600}
  .extra{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Guiones de vídeo · Momenturies</h1>
    <p id="sub">Presentador en HeyGen + planos reales colgando las fotos.</p>
  </header>
  <details class="reglas" open>
    <summary>Reglas para todos los guiones</summary>
    <ul id="reglas"></ul>
  </details>
  <div class="filtros" id="filtros"></div>
  <div class="grid" id="grid"></div>
  <p class="pie" id="pie"></p>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let data, filtro = 'Todos';

function render(){
  const lista = data.guiones.filter(g => filtro === 'Todos' || g.estado === filtro);
  $('#grid').innerHTML = lista.map(g => `
    <article class="card">
      <div class="top">
        <div>
          <div class="id">${esc(g.id)}</div>
          <h2>${esc(g.titulo)}</h2>
          <div class="meta"><span>${esc(g.angulo)}</span><span>${esc(g.publico)}</span><span>${esc(g.producto)}</span></div>
        </div>
        <span class="estado e-${esc(g.estado).replace(/ /g,'-')}">${esc(g.estado)}</span>
      </div>
      <table>
        <thead><tr><th>Tiempo</th><th>Voz del presentador</th><th>Plano</th></tr></thead>
        <tbody>${g.bloques.map(b => `<tr><td class="t">${esc(b.t)}</td><td class="voz">${esc(b.voz)}</td><td class="plano">${esc(b.plano)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="extra">
        <div><h3>Ganchos alternativos</h3><ul>${(g.gancho_alternativo||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div><h3>Texto en pantalla</h3><ul>${(g.texto_pantalla||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      </div>
      ${g.notas ? `<div class="notas">${esc(g.notas)}</div>` : ''}
      <div class="acciones"><button class="copy" data-id="${esc(g.id)}">Copiar texto para HeyGen</button></div>
    </article>`).join('') || '<p>No hay guiones en este estado.</p>';
}

function renderFiltros(){
  const usados = ['Todos', ...data.estados.filter(e => data.guiones.some(g => g.estado === e))];
  $('#filtros').innerHTML = usados.map(e => {
    const n = e === 'Todos' ? data.guiones.length : data.guiones.filter(g => g.estado === e).length;
    return `<button class="chip" aria-pressed="${e===filtro}" data-e="${esc(e)}">${esc(e)} · ${n}</button>`;
  }).join('');
}

document.addEventListener('click', async ev => {
  const chip = ev.target.closest('.chip');
  if (chip){ filtro = chip.dataset.e; renderFiltros(); render(); return; }
  const btn = ev.target.closest('.copy');
  if (btn){
    const g = data.guiones.find(x => x.id === btn.dataset.id);
    const texto = g.bloques.map(b => b.voz).join(' ');
    try { await navigator.clipboard.writeText(texto); btn.textContent = 'Copiado'; }
    catch { prompt('Copia el texto:', texto); }
    setTimeout(() => btn.textContent = 'Copiar texto para HeyGen', 1500);
  }
});

fetch('guiones.json?v=' + Date.now()).then(r => r.json()).then(d => {
  data = d;
  $('#reglas').innerHTML = d.reglas.map(r => `<li>${esc(r)}</li>`).join('');
  $('#pie').textContent = 'Última actualización: ' + d.actualizado;
  renderFiltros(); render();
}).catch(() => { $('#grid').innerHTML = '<p>No se pudo cargar guiones.json.</p>'; });
</script>
</body>
</html>
